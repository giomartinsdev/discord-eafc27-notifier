services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fc
      POSTGRES_PASSWORD: fc
      POSTGRES_DB: fc27
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fc -d fc27"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://fc:fc@db:5432/fc27
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
